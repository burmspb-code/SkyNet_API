[project]
name = "skynet-api"
version = "0.1.0"
description = "Aircraft monitoring"
authors = [
    {name = "Mikhail Byrdukovsky", email = "burmspb@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"  # Проверьте версию! 3.14 еще не вышла, лучше поставить 3.12 или 3.13
dependencies = []

[tool.poetry]
package-mode = false  # Отменяет установку проекта как библиотеки

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=1.20.0,<2.0.0)"
]
dev = [
    "requests (>=2.33.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "requests-mock (>=1.12.1,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "types-requests (>=2.33.0.20260408,<3.0.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)"
]
